<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>魔法闯关汉字游戏 · 童话三关预览</title>
  <link rel="stylesheet" href="goose-story.css">
  <link rel="stylesheet" href="clockbird-story.css">
  <link rel="stylesheet" href="elves-story.css">
  <link rel="stylesheet" href="new-stories-preview.css">
  <link rel="stylesheet" href="fairytale-stories-preview.css">
</head>
<body>
  <aside class="preview-panel" aria-label="画面预览控制">
    <p class="preview-label">魔法闯关汉字游戏 · 童话三关</p>
    <nav class="preview-scenes" aria-label="选择关卡">
      <button type="button" data-stage="goose" aria-pressed="true">金鹅黏黏队</button>
      <button type="button" data-stage="clockbird" aria-pressed="false">钟表夜莺</button>
      <button type="button" data-stage="elves" aria-pressed="false">小精灵午夜舞台</button>
    </nav>
    <div class="preview-story"><h1 id="previewTitle">金鹅黏黏队</h1><p id="previewDescription"></p></div>
    <div class="preview-progress"><span id="previewCount">0 / 10</span><div id="previewBeads" aria-hidden="true"></div></div>
    <p class="preview-status" id="previewStatus" role="status" aria-live="polite"></p>
    <div class="preview-actions">
      <button type="button" class="preview-primary" id="previewStep">通过一个字</button>
      <button type="button" class="preview-secondary" id="previewAuto">播放整关</button>
      <button type="button" class="preview-primary" id="previewEnding" hidden>再看一次结尾</button>
      <button type="button" class="preview-reset" id="previewReset">重看本关</button>
    </div>
  </aside>
  <script src="game-feedback.js"></script>
  <script src="goose-story.js"></script>
  <script src="clockbird-story.js"></script>
  <script src="elves-story.js"></script>
  <script src="fairytale-stories-preview.js"></script>
</body>
</html>
