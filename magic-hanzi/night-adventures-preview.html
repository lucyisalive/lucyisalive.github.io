<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔法闯关汉字游戏 · 关卡画面修订预览</title>
<link rel="stylesheet" href="wild-garden-story.css">
<link rel="stylesheet" href="tomb-pirate-story.css">
<link rel="stylesheet" href="seed-planet-story.css">
<link rel="stylesheet" href="goose-story.css">
<link rel="stylesheet" href="clockbird-story.css">
<link rel="stylesheet" href="elves-story.css">
<link rel="stylesheet" href="new-stories-preview.css">
<link rel="stylesheet" href="night-adventures-preview.css">
</head>
<body>
<aside class="preview-panel" aria-label="关卡画面修订预览">
<p class="preview-label">魔法闯关汉字游戏 · 画面修订与对照</p>
<nav class="preview-scenes" aria-label="选择故事">
<button type="button" data-stage="zoo" aria-pressed="true">午夜动物园</button>
<button type="button" data-stage="butterfly" aria-pressed="false">蝴蝶仙子</button>
<button type="button" data-stage="laser" aria-pressed="false">古墓激光</button>
<button type="button" data-stage="arrows" aria-pressed="false">挥剑挡箭</button>
<button type="button" data-stage="map" aria-pressed="false">藏宝图</button>
<button type="button" data-stage="pirate" aria-pressed="false">海盗船长</button>
<button type="button" data-stage="seed" aria-pressed="false">套娃星球</button>
<button type="button" data-stage="goose" aria-pressed="false">金鹅黏黏队</button>
<button type="button" data-stage="clockbird" aria-pressed="false">钟表夜莺</button>
<button type="button" data-stage="elves" aria-pressed="false">木偶小精灵</button>
</nav>
<div class="preview-story"><h1 id="previewTitle">午夜猛兽动物园</h1><p id="previewDescription"></p></div>
<div class="preview-progress"><span id="previewCount">0 / 10</span><div id="previewBeads" aria-hidden="true"></div></div>
<p class="preview-status" id="previewStatus" role="status" aria-live="polite"></p>
<div class="preview-actions">
<button type="button" class="preview-primary" id="previewStep">通过一个字</button>
<button type="button" class="preview-secondary" id="previewAuto">播放整关</button>
<button type="button" class="preview-primary" id="previewAction" hidden></button>
<button type="button" class="preview-primary" id="previewNext" hidden>前往下一关</button>
<button type="button" class="preview-secondary" id="previewChain">连看古墓四关</button>
<button type="button" class="preview-reset" id="previewReset">重看本关</button>
</div>
</aside>
<script src="game-feedback.js"></script>
<script src="wild-garden-story.js"></script>
<script src="tomb-pirate-story.js"></script>
<script src="seed-planet-story.js"></script>
<script src="goose-story.js"></script>
<script src="clockbird-story.js"></script>
<script src="elves-story.js"></script>
<script src="night-adventures-preview.js"></script>
</body>
</html>
