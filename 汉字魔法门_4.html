<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>汉字魔法门</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-1:#2a1a4a; --sky-2:#4b2a6b; --sky-3:#7b3f8f;
    --paper:#F6EFDD; --paper-2:#EFE4C8;
    --ink:#22201C; --seal:#B3231C; --seal-dark:#8C1B15;
    --gold:#D9B44A; --jade:#3C6E58; --grid:#D98A82;
    --door-wood:#5b3a24; --door-wood-dark:#3a2416;
    --star:#FFF6D6;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; overflow:hidden; overscroll-behavior:none; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html{
    background:
      radial-gradient(ellipse at 50% 0%, var(--sky-3) 0%, var(--sky-2) 45%, var(--sky-1) 100%);
  }
  body{
    font-family:'Baloo 2', sans-serif;
    background:
      radial-gradient(ellipse at 50% 0%, var(--sky-3) 0%, var(--sky-2) 45%, var(--sky-1) 100%);
    display:flex; align-items:center; justify-content:center;
    padding:20px 10px;
    color:var(--ink);
    /* Pin the document to exactly the viewport so there is no scrollable page at all —
       stronger than overscroll-behavior/touchmove tricks, which some in-app browsers
       (e.g. iPad file-viewer apps) don't fully respect. Panels that need their own
       scroll (.panel, .queue-list) keep working since they scroll internally. */
    position:fixed; inset:0;
  }
  .stars-bg{ position:fixed; inset:0; pointer-events:none; z-index:0; }
  .stars-bg span{
    position:absolute; width:3px; height:3px; background:var(--star);
    border-radius:50%; opacity:.8; animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.2;} 50%{opacity:1;} }

  .stage{
    width:100%; max-width:480px; position:relative; z-index:1;
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:10px; padding:0 4px;
  }
  .progress-path{
    display:flex; gap:5px; flex:1; margin-right:10px; flex-wrap:wrap;
  }
  .progress-dot{
    width:11px; height:11px; border-radius:50%;
    background:rgba(255,255,255,.18); border:1.5px solid rgba(255,255,255,.3);
  }
  .progress-dot.done{ background:var(--gold); border-color:var(--gold); }
  .progress-dot.current{ background:var(--star); border-color:var(--star); box-shadow:0 0 8px var(--star); }
  .icon-btn{
    width:34px; height:34px; border-radius:50%; border:none;
    background:rgba(255,255,255,.12); color:var(--star);
    font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    margin-left:6px;
  }
  .icon-btn:active{ transform:scale(.92); }

  /* ---------- door scene ---------- */
  .scene{
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.15));
    border-radius:18px;
    padding:22px 16px 18px;
    position:relative;
    box-shadow: 0 20px 50px rgba(0,0,0,.4), inset 0 0 60px rgba(123,63,143,.25);
    border: 1px solid rgba(255,255,255,.08);
  }

  .doorway{
    width:220px; height:270px;
    margin:0 auto 14px;
    position:relative;
  }
  .approach-path{
    width:220px; margin:0 auto -6px; position:relative; z-index:0; opacity:.9;
  }
  .path-step{ fill:var(--door-wood); }
  .doorframe{
    position:absolute; inset:0;
    border-radius:110px 110px 8px 8px;
    background: linear-gradient(180deg, var(--door-wood), var(--door-wood-dark));
    box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 0 0 6px rgba(0,0,0,.25);
    padding:10px;
    overflow:hidden;
  }
  .scene-backdrop{
    position:absolute; inset:10px;
    border-radius:100px 100px 4px 4px;
    overflow:hidden;
    z-index:0;
  }
  .scene-photo{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:50% 35%;
    transform:scale(1.18); transform-origin:center;
    display:block;
  }
  .scene-shade{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%);
    pointer-events:none;
  }
  .scene-fireflies{ position:absolute; inset:0; display:block; pointer-events:none; }
  .firefly{
    fill: var(--gold);
    filter: drop-shadow(0 0 3px var(--gold));
    animation: fireflyPulse 2.6s ease-in-out infinite;
  }
  .firefly-2{ animation-delay:.6s; }
  .firefly-3{ animation-delay:1.1s; }
  .firefly-4{ animation-delay:1.7s; }
  @keyframes fireflyPulse{ 0%,100%{ opacity:.25; } 50%{ opacity:1; } }

  .doorpanel{
    position:absolute; inset:10px;
    border-radius:100px 100px 4px 4px;
    overflow:hidden;
    z-index:2;
    perspective: 900px;
  }
  .door-leaf{
    position:absolute; top:0; width:50%; height:100%;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 3px, transparent 3px 22px),
      linear-gradient(180deg, var(--door-wood), var(--door-wood-dark));
    box-shadow: inset 0 0 18px rgba(0,0,0,.45);
    transition: transform .9s cubic-bezier(.32,1.3,.55,1);
    backface-visibility:hidden;
  }
  .door-leaf-left{ left:0; transform-origin:left center; border-top-left-radius:100px; }
  .door-leaf-right{ right:0; transform-origin:right center; border-top-right-radius:100px; }
  .doorpanel.open .door-leaf-left{ transform: rotateY(-108deg); }
  .doorpanel.open .door-leaf-right{ transform: rotateY(108deg); }

  .door-glow-seam{
    position:absolute; top:0; left:50%; width:6px; height:100%;
    transform:translateX(-50%);
    background: radial-gradient(ellipse at center, var(--gold), transparent 70%);
    opacity:0; z-index:3; pointer-events:none;
  }
  .doorpanel.open .door-glow-seam{ animation: seamFlash .9s ease-out; }
  @keyframes seamFlash{ 0%{ opacity:0; } 25%{ opacity:.9; width:26px;} 100%{ opacity:0; width:6px; } }

  .doorpanel-content{
    position:absolute; inset:10px;
    border-radius:100px 100px 4px 4px;
    display:flex; align-items:center; justify-content:center;
    z-index:4;
  }
  .rune{
    position:absolute; inset:4px;
    border:2px solid rgba(217,180,74,.5);
    border-radius:90px 90px 4px 4px;
    pointer-events:none;
  }

  .char-glow{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Ma Shan Zheng', cursive;
    font-size:96px;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(217,180,74,.7), 0 0 4px rgba(255,255,255,.5);
    transition: opacity .4s ease;
  }
  .char-glow.hidden{ opacity:0; }

  .write-slot{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    z-index:20;
    background: rgba(0,0,0,.35);
    touch-action:none;
    /* The overlay spans the full screen so it isn't clipped by the tiny doorway box, but
       that means it would also sit on top of (and swallow taps for) anything else on
       screen — e.g. the ⚙️ settings button — for as long as a challenge is active, which
       is almost always. Make the backdrop itself click-through, and only the actual
       writing panel (canvas + its buttons) clickable. */
    pointer-events:none;
  }
  .write-canvas-wrap, .write-controls-row{
    pointer-events:auto;
  }
  .write-controls-row{
    display:flex; justify-content:center; gap:10px;
  }
  .write-canvas-wrap{
    width:300px; height:300px;
    background: rgba(246,239,221,.94);
    border-radius:12px;
    position:relative;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
    touch-action:none;
    display:flex; align-items:center; justify-content:center;
  }
  /* This is a plain text field, not a custom drawing surface — writing happens through the
     device's own Chinese handwriting keyboard (switch to it via the keyboard-globe icon),
     and whatever character it recognizes lands in here automatically, just like typing.
     That hands the actual recognition off to the OS's own (far more capable) handwriting
     engine instead of us trying to judge hand-drawn ink ourselves. */
  .hanzi-input{
    position:relative; z-index:2;
    width:100%; height:100%;
    border:none; outline:none; background:transparent;
    text-align:center;
    font-size:170px;
    color:var(--ink);
    font-family:'Ma Shan Zheng', cursive, sans-serif;
    padding:0;
    caret-color: var(--seal);
  }
  .grid-lines{
    position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      linear-gradient(45deg, var(--grid) 1px, transparent 1px),
      linear-gradient(-45deg, var(--grid) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 141.4% 141.4%, 141.4% 141.4%;
    background-position:center; background-repeat:no-repeat;
    opacity:.55;
  }
  .write-target{ width:150px; height:150px; position:relative; z-index:2; }

  .shake{ animation: shake .35s; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  .pinyin-tag{
    position:absolute; top:-30px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:#3a2416; font-weight:800; font-size:15px;
    padding:3px 12px; border-radius:999px; white-space:nowrap;
    box-shadow:0 3px 8px rgba(0,0,0,.3);
  }

  .status-line{
    text-align:center; color:var(--star); font-size:14px; min-height:20px; margin-bottom:10px;
  }
  .timer-ring{
    width:34px; height:34px; margin:0 auto 6px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:var(--gold); font-size:14px;
    border:3px solid var(--gold); border-radius:50%;
  }

  .controls-row{
    display:flex; justify-content:center; gap:10px; margin-top:4px;
  }
  button.game-btn{
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px;
    border:none; border-radius:999px; padding:11px 20px; cursor:pointer;
    transition: transform .12s ease;
  }
  button.game-btn:active{ transform:scale(.94); }
  .btn-submit{ background: var(--jade); color:#fff; box-shadow:0 4px 10px rgba(60,110,88,.4); }
  .btn-clear{ background:transparent; color:rgba(255,255,255,.7); border:1.5px solid rgba(255,255,255,.3); }
  .btn-continue{ background: var(--gold); color:#3a2416; display:none; box-shadow:0 4px 10px rgba(217,180,74,.4); }
  .btn-continue.show{ display:inline-block; }

  .result-banner{
    text-align:center; font-weight:800; font-size:16px; margin:8px 0 2px; min-height:22px;
  }
  .result-banner.correct{ color:#8fe0b0; }
  .result-banner.wrong{ color:#f0a0a0; }

  /* ---------- finale ---------- */
  .finale{ display:none; text-align:center; padding:20px 4px 4px; }
  .finale.show{ display:block; }
  .finale .big{ font-family:'Ma Shan Zheng', cursive; font-size:36px; color:var(--star); }
  .finale p{ color:rgba(255,255,255,.7); font-size:14px; }

  .playzone.hide{ display:none; }

  /* ---------- settings panel ---------- */
  .panel-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.55);
    z-index:10; align-items:flex-end; justify-content:center;
  }
  .panel-overlay.show{ display:flex; }
  .panel{
    width:100%; max-width:480px; background:var(--paper);
    border-radius:18px 18px 0 0; padding:18px 16px 22px; max-height:85vh; overflow-y:auto;
    touch-action:pan-y;
  }
  .panel h2{ font-family:'Ma Shan Zheng', cursive; color:var(--seal-dark); margin:0 0 12px; font-size:24px; }
  .panel label{ display:block; font-size:12px; color:#6b6355; margin:10px 0 4px; font-weight:700; }
  .panel input[type=text]{
    width:100%; padding:9px 10px; border-radius:8px; border:1.5px solid #cfc4a8;
    font-family:'Baloo 2', sans-serif; font-size:14px; background:#fff;
    -webkit-user-select:text; user-select:text; -webkit-touch-callout:default;
  }
  .panel input[type=number]{
    -webkit-user-select:text; user-select:text; -webkit-touch-callout:default;
  }
  .add-row{ display:flex; gap:6px; margin-top:6px; }
  .add-row input{ flex:1; }
  .add-row button{
    background:var(--jade); color:#fff; border:none; border-radius:8px; padding:0 14px;
    font-weight:700; cursor:pointer;
  }
  .queue-list{ margin-top:10px; max-height:140px; overflow-y:auto; touch-action:pan-y; }
  .queue-item{
    display:flex; justify-content:space-between; align-items:center;
    background:#fff; border-radius:8px; padding:7px 10px; margin-bottom:5px; font-size:14px;
  }
  .queue-item .del{ color:var(--seal); cursor:pointer; font-weight:700; }
  .panel-actions{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .panel-actions button{
    flex:1; min-width:120px; padding:10px; border-radius:10px; border:none;
    font-weight:700; cursor:pointer; font-family:'Baloo 2', sans-serif; font-size:13px;
  }
  .btn-save{ background:var(--jade); color:#fff; }
  .btn-load{ background:var(--gold); color:#3a2416; }
  .btn-close-panel{ background:#cfc4a8; color:#3a2416; width:100%; margin-top:8px; }
  .hint-text{ font-size:11.5px; color:#8a8272; margin-top:8px; line-height:1.5; }
  #fileInput{ display:none; }
  .daily-count-row{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .daily-count-row input[type=number]{ width:70px; padding:8px; border-radius:8px; border:1.5px solid #cfc4a8; }
</style>
</head>
<body>

<div class="stars-bg" id="starsBg"></div>

<div class="stage">
  <div class="topbar">
    <div class="progress-path" id="progressPath"></div>
    <button class="icon-btn" id="settingsBtn" title="设置">⚙️</button>
  </div>

  <div class="scene" id="playzone">
    <div class="approach-path">
      <svg viewBox="0 0 220 70" width="220" height="70" preserveAspectRatio="none">
        <polygon points="70,70 150,70 128,50 92,50" class="path-step" opacity="0.9"/>
        <polygon points="82,48 138,48 122,32 98,32" class="path-step" opacity="0.75"/>
        <polygon points="94,30 126,30 116,18 104,18" class="path-step" opacity="0.6"/>
      </svg>
    </div>
    <div class="doorway">
      <div class="doorframe">
        <div class="scene-backdrop" id="sceneBackdrop">
          <img class="scene-photo" id="sceneImg" alt="">
          <div class="scene-shade"></div>
          <svg class="scene-fireflies" viewBox="0 0 200 250" width="100%" height="100%" preserveAspectRatio="xMidYMax slice">
            <circle class="firefly" cx="60" cy="130" r="2.6"/>
            <circle class="firefly firefly-2" cx="140" cy="150" r="2.2"/>
            <circle class="firefly firefly-3" cx="95" cy="90" r="2.8"/>
            <circle class="firefly firefly-4" cx="150" cy="90" r="2"/>
          </svg>
        </div>
        <div class="doorpanel" id="doorpanel">
          <div class="door-leaf door-leaf-left"></div>
          <div class="door-leaf door-leaf-right"></div>
          <div class="door-glow-seam"></div>
        </div>
        <div class="doorpanel-content">
          <div class="rune"></div>
          <div class="char-glow" id="charGlow"></div>
        </div>
      </div>

      <div class="write-slot" id="writeSlot" style="display:none;">
        <div class="write-canvas-wrap" id="writeTile">
          <div class="pinyin-tag" id="pinyinTag"></div>
          <div class="grid-lines"></div>
          <input type="text" id="hanziInput" class="hanzi-input" maxlength="4"
            autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false" enterkeyhint="done">
        </div>
        <div class="write-controls-row">
          <button class="game-btn btn-clear" id="clearBtn">擦掉重写</button>
          <button class="game-btn btn-submit" id="submitBtn">写好了</button>
        </div>
      </div>
    </div>

    <div class="timer-ring" id="timerRing" style="display:none;"></div>
    <div class="status-line" id="statusLine">看拼音，写出这个字，推开这扇门</div>
    <div class="result-banner" id="resultBanner"></div>

    <div class="controls-row">
      <button class="game-btn btn-continue" id="continueBtn">继续 →</button>
    </div>
  </div>

  <div class="finale" id="finale">
    <div class="big">今天的门都推开啦！</div>
    <p id="finaleDetail"></p>
    <button class="game-btn btn-submit" id="restartBtn" style="margin-top:8px;">再来一轮</button>
  </div>
</div>

<div class="panel-overlay" id="panelOverlay">
  <div class="panel">
    <h2>今日汉字设置</h2>

    <label>今天优先默写的字（加拼音，词语可选）</label>
    <div class="add-row">
      <input type="text" id="charInput" placeholder="字，如：龙">
      <input type="text" id="pinyinInput" placeholder="拼音，如：lóng">
      <input type="text" id="wordInput" placeholder="词语（可选），如：龙年">
      <button id="addCharBtn">加入</button>
    </div>
    <div class="queue-list" id="queueList"></div>

    <label>每天要通过几个字才算完成</label>
    <div class="daily-count-row">
      <input type="number" id="dailyCount" min="1" max="30" value="5">
      <span style="font-size:12px;color:#6b6355;">个字（真正通过，不含放弃重来的）</span>
    </div>

    <div class="panel-actions">
      <button class="btn-save" id="saveProgressBtn">💾 保存今天的进度</button>
      <button class="btn-load" id="loadProgressBtn">📂 读取存档</button>
    </div>
    <input type="file" id="fileInput" accept="application/json">
    <p class="hint-text">
      提示：因为这个小游戏是直接在浏览器里打开的网页，不会自动联网保存。每次练完，请点"保存今天的进度"，会下载一个存档文件；下次打开游戏时，先点"读取存档"选那个文件，就能接着昨天的进度和字库继续练习。
      <br><br>
      字库会按"记忆规律"自动滚动：今天答错、靠教学环节才写对的字，会更快安排复习；一次就写对的字，安排复习的间隔会拉长。你随时可以在这里加"今天最想让孩子先练"的字，这些字会排在最前面。
    </p>

    <button class="btn-close-panel" id="closePanelBtn">关闭</button>
  </div>
</div>

<script>
/* ============================================================
   汉字魔法门 — 默写版
   核心机制：
   1. 每字先"自由默写"，写完点"写好了"才整体判断对错（不是逐笔纠错）
   2. 答错 -> 教学环节：展示字 5s -> 消失 -> 默写 -> 对了展示4s -> ... 递减到0
      连续独立默写对 3 次（不看字）-> 判定掌握，开门
   3. 一次就写对 -> 直接开门
   4. 字库用简化的间隔重复：写错次数越多，下次复习间隔越短；
      连续写对，间隔逐渐拉长
   5. 家长可添加"今日优先字"，存档/读档保存长期进度
   ============================================================ */

const STORAGE_KEY_HINT = "本地网页无法自动联网保存，需要手动导出/导入存档文件";

// ---------- default character bank ----------
// interval: 距离上次练习多少天后应该再次出现（简化的间隔重复）
// box: 掌握等级 0(生) -> 4(熟练)，等级越高 interval 越长
function defaultBank(){
  return [
    { char:'理', pinyin:'lǐ',   word:'心_', box:1, interval:0, lastSeen:null, history:[] },
    { char:'学', pinyin:'xué',  word:'大_', box:1, interval:0, lastSeen:null, history:[] },
    { char:'生', pinyin:'shēng',word:'卫_', box:1, interval:0, lastSeen:null, history:[] },
    { char:'师', pinyin:'shī',  word:'老_', box:1, interval:0, lastSeen:null, history:[] },
    { char:'注', pinyin:'zhù',  word:'_意', box:1, interval:0, lastSeen:null, history:[] },
  ];
}

let state = {
  bank: defaultBank(),
  priorityQueue: [],   // chars typed in today by parent, always go first
  dailyCount: 5,        // how many characters must be PASSED (not just attempted) to finish today
  daysElapsed: 0,       // simple counter incremented each "day" (each restart/session), used for interval scheduling
  scenesUnlocked: 0,    // how many magic-world scenes have been unlocked so far (persisted)
};

// ---------- session runtime ----------
let passedCount = 0;          // characters PASSED so far this session (goal: state.dailyCount)
let currentItem = null;       // the character object currently on screen
let currentMode = 'free';     // 'free' | 'teaching' | 'retest'
let currentRound = 1;         // 1 or 2, only meaningful in teaching mode
let stepIndex = 0;            // index into TEACHING_STEPS
let stepAttempts = 0;         // attempts used at the current step (max 2)
let pendingRetests = [];      // [{item, round, fillersSeen}] — delayed blind re-checks
let priorityConsumedToday = new Set(); // priority chars already served this session
let timerHandle = null;
const TEACHING_STEPS = [5, 3, 1, 0]; // seconds character is shown before each retry; 0 = blind

// ---------- writing surface: a real text input, filled in by the device's own Chinese
// handwriting keyboard (switch to it via the keyboard-globe icon). Whatever character it
// recognizes lands in here automatically, just like typing — recognition is entirely the
// OS's job now, not ours. See gradeDrawing() further down for the (trivial) comparison.
const hanziInput = document.getElementById('hanziInput');

function clearCanvas(){
  hanziInput.value = '';
}

// Some webviews (e.g. iPad file-viewer apps) don't honor the CSS overscroll-behavior
// property and will still rubber-band/bounce the whole page on any drag. Block touchmove
// document-wide as a belt-and-suspenders fix, except inside the settings panel (which needs
// its own native scroll) — buttons/taps are unaffected since those fire on touchend, not touchmove.
document.addEventListener('touchmove', (e) => {
  if(e.target.closest('.panel, .queue-list')) return;
  e.preventDefault();
}, { passive:false });

// Best-effort: ask for real browser Fullscreen on the first touch. Most third-party iPad
// file-viewer webviews don't support/allow this (the call just silently rejects, harmless),
// but if this particular one does, it removes the host app's own reader chrome entirely —
// fixing the tap-to-toggle-fullscreen behavior at the root instead of fighting it per-gesture.
document.addEventListener('pointerdown', () => {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if(req && !document.fullscreenElement) req.call(el).catch(() => {});
}, { once:true });

// The device's handwriting keyboard already did the actual recognition — this just checks
// whether what it inserted matches the target character. No stroke data, no geometry, no
// network: the whole "is this the right character" question is the OS's problem now.
function gradeDrawing(char){
  return hanziInput.value.trim() === char;
}

const sceneImg = document.getElementById('sceneImg');
const doorpanel = document.getElementById('doorpanel');

// ---------- starfield ----------
(function initStars(){
  const bg = document.getElementById('starsBg');
  for(let i=0;i<40;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100+'%';

    s.style.animationDelay = (Math.random()*3)+'s';
    bg.appendChild(s);
  }
})();

// ---------- selecting the next character to work on ----------
function pickNextChar(){
  const pendingChars = new Set(pendingRetests.map(r => r.item.char));

  // parent-added "today" priority characters go first, once each
  const nextPriority = state.priorityQueue.find(p => !priorityConsumedToday.has(p.char) && !pendingChars.has(p.char));
  if(nextPriority){
    priorityConsumedToday.add(nextPriority.char);
    let existing = state.bank.find(b => b.char === nextPriority.char);
    if(!existing){
      existing = { char:nextPriority.char, pinyin:nextPriority.pinyin, word:nextPriority.word||'', box:1, interval:0, lastSeen:null, history:[] };
      state.bank.push(existing);
    }
    return existing;
  }
  // otherwise pick whichever bank character is due for review (or, if none
  // are strictly "due" yet, just the weakest one) — this same rule naturally
  // supplies a repeat character as filler for a delayed retest when the
  // queue would otherwise be empty. Characters currently awaiting their OWN
  // delayed retest are excluded so they can't jump the queue and reappear
  // before the real interleaving gap has happened.
  const candidates = state.bank.filter(b => !pendingChars.has(b.char));
  const pickFrom = candidates.length ? candidates : state.bank; // only fall back to full bank if literally everything is pending
  const due = pickFrom.filter(b => b.lastSeen === null || (state.daysElapsed - b.lastSeen) >= b.interval);
  const pool = (due.length ? due : pickFrom).slice().sort((a,b) => a.box - b.box);
  return pool[0];
}

function renderProgressPath(){
  const target = state.dailyCount;
  progressPath.innerHTML = Array.from({length: target}).map((_, i) => {
    const cls = i < passedCount ? 'progress-dot done' : 'progress-dot';
    return `<div class="${cls}"></div>`;
  }).join('');
}

// ---------- door state ----------
// ---------- tiny synthesized sound effects (no audio files, no network) ----------
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  }
  return audioCtx;
}
function playTone(freq, duration, type, gainStart){
  const ctx = ensureAudio();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(gainStart, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + duration);
}
function playSuccessDing(){
  playTone(880, 0.18, 'triangle', 0.16);
  setTimeout(() => playTone(1320, 0.24, 'triangle', 0.12), 90);
}
function playDoorCreak(){
  const ctx = ensureAudio();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(170, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(85, ctx.currentTime + 0.7);
  gain.gain.setValueAtTime(0.05, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.75);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.8);
}

function setDoorClosed(){ doorpanel.classList.remove('open'); }
function setDoorOpen(){ doorpanel.classList.add('open'); playDoorCreak(); }

function showGlowChar(char, visible){
  charGlow.textContent = char;
  charGlow.classList.toggle('hidden', !visible);
}

// ---------- main flow ----------
function loadNextDoor(){
  if(passedCount >= state.dailyCount && pendingRetests.length === 0){
    showFinale();
    return;
  }

  // is a delayed retest ready to be inserted now (its 2 filler characters have happened)?
  const readyRetest = pendingRetests.find(r => r.fillersSeen >= 2);
  if(readyRetest){
    pendingRetests = pendingRetests.filter(r => r !== readyRetest);
    presentDoor(readyRetest.item, 'retest', readyRetest.round);
  } else {
    const item = pickNextChar();
    // any OTHER item still waiting for its delayed retest just got a filler
    pendingRetests.forEach(r => { r.fillersSeen += 1; });
    presentDoor(item, 'free', 1);
  }
}

function presentDoor(item, mode, round){
  currentItem = item;
  currentMode = mode;
  currentRound = round;
  stepIndex = 0;
  stepAttempts = 0;

  setDoorClosed();
  resultBanner.textContent = '';
  resultBanner.className = 'result-banner';
  continueBtn.classList.remove('show');
  timerRing.style.display = 'none';
  showGlowChar('', false);
  pinyinTag.textContent = item.pinyin;
  renderProgressPath();

  if(mode === 'free'){
    // NOTE: the blank is replaced with the pinyin, never with the actual answer character
    pinyinTag.textContent = item.word ? item.word.replace('_', item.pinyin) : item.pinyin;
    statusLine.textContent = '看拼音，把字写在格子里，写完点"写好了"';
    clearCanvas();
    writeSlot.style.display = 'flex';
    submitBtn.style.display = 'inline-block';
    clearBtn.style.display = 'inline-block';
  } else if(mode === 'retest'){
    pinyinTag.textContent = item.word ? item.word.replace('_', item.pinyin) : item.pinyin;
    statusLine.textContent = '过了一会儿了，还记得刚才那个字吗？凭记忆写出来';
    clearCanvas();
    writeSlot.style.display = 'flex';
    submitBtn.style.display = 'inline-block';
    clearBtn.style.display = 'inline-block';
  } else {
    // 'teaching' handled by startTeachingRound()
    startTeachingRound();
  }
}

// ---------- result handling & teaching-mode state machine ----------
function recordResult(item, outcome){
  // outcome: 'first-try' | 'retest-pass' | 'abandoned'
  item.lastSeen = state.daysElapsed;
  if(outcome === 'first-try') item.box = Math.min(6, item.box + 1);
  else if(outcome === 'abandoned') item.box = Math.max(0, item.box - 1);
  // 'retest-pass' leaves box unchanged — it took real effort, not free
  const schedule = [1, 2, 4, 7, 14, 21, 30]; // days, indexed by box 0..6
  item.interval = outcome === 'abandoned' ? 1 : schedule[Math.min(item.box, schedule.length - 1)];
  item.history.push({ day: state.daysElapsed, outcome });
}

function markPassed(item, outcome, message){
  setDoorOpen();
  playSuccessDing();
  showGlowChar(item.char, true);
  writeSlot.style.display = 'none';
  submitBtn.style.display = 'none';
  clearBtn.style.display = 'none';
  timerRing.style.display = 'none';
  resultBanner.textContent = message;
  resultBanner.className = 'result-banner correct';
  statusLine.textContent = '';
  recordResult(item, outcome);
  passedCount += 1;
  renderProgressPath();
  continueBtn.classList.add('show');
}

function markAbandonedToday(item){
  writeSlot.style.display = 'none';
  submitBtn.style.display = 'none';
  clearBtn.style.display = 'none';
  timerRing.style.display = 'none';
  showGlowChar('', false);
  resultBanner.textContent = '这个字今天先不勉强了，妈妈可以陪他编个小故事，明天再来试试';
  resultBanner.className = 'result-banner wrong';
  statusLine.textContent = '';
  recordResult(item, 'abandoned');
  continueBtn.classList.add('show');
}

function handleAttemptResult(ok){
  const item = currentItem;

  if(currentMode === 'free'){
    if(ok){
      markPassed(item, 'first-try', '一次就写对啦！门开了 ✨');
    } else {
      currentMode = 'teaching';
      currentRound = 1;
      stepIndex = 0;
      stepAttempts = 0;
      resultBanner.textContent = '这次没对，我们一起再练几次';
      resultBanner.className = 'result-banner wrong';
      startTeachingRound();
    }
    return;
  }

  if(currentMode === 'retest'){
    if(ok){
      markPassed(item, 'retest-pass', '隔了一会儿还记得！真的记住啦 ✨');
    } else {
      handleRoundFailure(item);
    }
    return;
  }

  // currentMode === 'teaching'
  const step = TEACHING_STEPS[stepIndex];
  const atBlind = step === 0;

  if(ok){
    if(!atBlind){
      stepIndex += 1;
      stepAttempts = 0;
      resultBanner.textContent = '对啦！时间再短一点试试';
      resultBanner.className = 'result-banner correct';
      startTeachingRound();
    } else {
      // blind write correct — don't pass yet, schedule the delayed retest
      pendingRetests.push({ item, round: currentRound, fillersSeen: 0 });
      resultBanner.textContent = '不看字也写对了！等下再考你一次，确认是不是真记住了';
      resultBanner.className = 'result-banner correct';
      statusLine.textContent = '';
      continueBtn.classList.add('show');
      // "继续" moves on to other characters; the retest will surface once ready
    }
  } else {
    stepAttempts += 1;
    if(stepAttempts >= 2){
      handleRoundFailure(item);
    } else {
      resultBanner.textContent = '还差一点，再看一眼';
      resultBanner.className = 'result-banner wrong';
      startTeachingRound();
    }
  }
}

function handleRoundFailure(item){
  if(currentRound === 1){
    currentMode = 'teaching';
    currentRound = 2;
    stepIndex = 0;
    stepAttempts = 0;
    resultBanner.textContent = '这一轮没完全成功，我们完整地再来一轮';
    resultBanner.className = 'result-banner wrong';
    startTeachingRound();
  } else {
    markAbandonedToday(item);
  }
}

function startTeachingRound(){
  const item = currentItem;
  writeSlot.style.display = 'none';
  submitBtn.style.display = 'none';
  clearBtn.style.display = 'none';
  clearTimeout(timerHandle);

  const step = TEACHING_STEPS[stepIndex];
  if(step > 0){
    showGlowChar(item.char, true);
    timerRing.style.display = 'flex';
    let remaining = step;
    timerRing.textContent = remaining;
    statusLine.textContent = '看好这个字，等一下要凭记忆写出来';
    timerHandle = setInterval(() => {
      remaining -= 1;
      if(remaining <= 0){
        clearInterval(timerHandle);
        showGlowChar('', false);
        timerRing.style.display = 'none';
        beginWritingPhase(item);
      } else {
        timerRing.textContent = remaining;
      }
    }, 1000);
  } else {
    showGlowChar('', false);
    statusLine.textContent = '不看字，凭记忆写出来';
    beginWritingPhase(item);
  }
}

function beginWritingPhase(item){
  pinyinTag.textContent = item.pinyin;
  clearCanvas();
  writeSlot.style.display = 'flex';
  submitBtn.style.display = 'inline-block';
  clearBtn.style.display = 'inline-block';
  hanziInput.focus(); // brings up the keyboard so writing can start right away
  if(statusLine.textContent === '' || statusLine.textContent.includes('看好')){
    statusLine.textContent = TEACHING_STEPS[stepIndex] > 0 ? '现在凭记忆写出来' : '不看字写出来';
  }
}

// Diagnostics on an earlier version of this page (real Apple Pencil taps on iPadOS) proved
// 'click' never fires at all in that environment, even though 'pointerdown' fires reliably
// — likely a WebKit-on-iPad quirk where touch-action:none (needed elsewhere to stop page
// scroll/bounce) also suppresses the browser's synthesized click event, not just panning.
// Rather than depend on 'click' at all, every button below responds to 'pointerup' directly
// (confirmed to always fire), with 'click' kept as a second listener and a short dedupe
// window so this also keeps working normally in any browser where click fires fine (desktop,
// most others) without ever double-firing.
function onTap(el, handler){
  let lastFired = 0;
  function fire(e){
    const now = Date.now();
    if(now - lastFired < 400) return;
    lastFired = now;
    handler(e);
  }
  el.addEventListener('pointerup', fire);
  el.addEventListener('click', fire);
}

onTap(submitBtn, function(){
  const item = currentItem;
  const ok = gradeDrawing(item.char);
  handleAttemptResult(ok);
});

onTap(clearBtn, function(){
  clearCanvas();
});

onTap(continueBtn, function(){
  loadNextDoor();
});

onTap(restartBtn, function(){
  state.daysElapsed += 1;
  passedCount = 0;
  pendingRetests = [];
  priorityConsumedToday = new Set();
  applyScene(state.scenesUnlocked);
  finale.classList.remove('show');
  playzone.classList.remove('hide');
  loadNextDoor();
});

// ---------- settings panel ----------
onTap(settingsBtn, () => panelOverlay.classList.add('show'));
onTap(closePanelBtn, () => panelOverlay.classList.remove('show'));

function renderQueueList(){
  queueList.innerHTML = state.priorityQueue.map((p, i) => `
    <div class="queue-item">
      <span>${p.char}（${p.pinyin}）${p.word ? ' · '+p.word : ''}</span>
      <span class="del" data-i="${i}">删除</span>
    </div>
  `).join('') || '<div style="font-size:12px;color:#8a8272;">暂无今日优先字</div>';

  queueList.querySelectorAll('.del').forEach(el => {
    onTap(el, () => {
      state.priorityQueue.splice(Number(el.dataset.i), 1);
      renderQueueList();
    });
  });
}

onTap(addCharBtn, () => {
  const c = charInput.value.trim();
  const p = pinyinInput.value.trim();
  const w = wordInput.value.trim();
  if(!c || !p) return;
  state.priorityQueue.push({ char:c, pinyin:p, word:w });
  charInput.value = ''; pinyinInput.value=''; wordInput.value='';
  renderQueueList();
});

dailyCountInput.addEventListener('change', () => {
  const v = parseInt(dailyCountInput.value, 10);
  if(v > 0) state.dailyCount = v;
});

onTap(saveProgressBtn, () => {
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `汉字魔法门_存档_${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

onTap(loadProgressBtn, () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const loaded = JSON.parse(ev.target.result);
      if(loaded && loaded.bank){
        state = loaded;
        if(typeof state.scenesUnlocked !== 'number') state.scenesUnlocked = 0;
        renderQueueList();
        dailyCountInput.value = state.dailyCount || 5;
        passedCount = 0;
        pendingRetests = [];
        priorityConsumedToday = new Set();
        applyScene(state.scenesUnlocked);
        finale.classList.remove('show');
        playzone.classList.remove('hide');
        loadNextDoor();
        alert('存档读取成功！');
      } else {
        alert('这个文件看起来不是有效的存档。');
      }
    }catch(err){
      alert('读取失败，文件可能损坏。');
    }
  };
  reader.readAsText(file);
});

// ---------- scenes (cosmetic reward for finishing today's target) ----------
const SCENES = [
  { name:'魔法花房',   img:'scene2.jpg', sky:['#3a2a12','#6b4a1f','#b9862f'], wood:['#5b3a24','#3a2416'] },
  { name:'观星塔',     img:'scene3.jpg', sky:['#12213b','#1e3a5f','#3f7a8c'], wood:['#2b2440','#171224'] },
  { name:'月光花园',   img:'scene4.jpg', sky:['#131c3d','#232f5c','#3a4a8c'], wood:['#3e4a52','#232b31'] },
  { name:'萌宠草坪',   img:'scene5.jpg', sky:['#3a2a12','#6b4a1f','#8a5a1f'], wood:['#7a5a2e','#4a361a'] },
  { name:'魔法图书馆', img:'scene6.jpg', sky:['#3a1f10','#5c3018','#8a5228'], wood:['#4a2a1a','#2c180e'] },
  { name:'彩虹草原',   img:'scene1.jpg', sky:['#2a1a4a','#4b2a6b','#7b3f8f'], wood:['#5b3a24','#3a2416'], fit:'top' },
];

function applyScene(index){
  const scene = SCENES[index % SCENES.length];
  const root = document.documentElement.style;
  root.setProperty('--sky-1', scene.sky[0]);
  root.setProperty('--sky-2', scene.sky[1]);
  root.setProperty('--sky-3', scene.sky[2]);
  root.setProperty('--door-wood', scene.wood[0]);
  root.setProperty('--door-wood-dark', scene.wood[1]);
  sceneImg.src = scene.img;
  sceneImg.style.objectPosition = scene.fit === 'top' ? '50% 8%' : '50% 35%';
}

function showFinale(){
  playzone.classList.add('hide');
  finale.classList.add('show');
  const sceneName = SCENES[state.scenesUnlocked % SCENES.length].name;
  finaleDetail.textContent = `今天推开了 ${passedCount} 扇门！解锁了新场景：${sceneName}`;
  state.scenesUnlocked += 1;
}

applyScene(state.scenesUnlocked);

// ---------- init ----------
renderQueueList();
loadNextDoor();
